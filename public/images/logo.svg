<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6E500B" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081830" />
      <stop offset="50%" stop-color="#0F284E" />
      <stop offset="100%" stop-color="#051020" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="40%" stop-color="#F5B041" />
      <stop offset="85%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="200" cy="200" r="190" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle cx="200" cy="200" r="142" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Circular Text Paths -->
  <path id="textPathTop" d="M 50,200 A 150,150 0 1,1 350,200" fill="none" />
  <path id="textPathBottom" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />

  <!-- Top Text: SIR C. R. REDDY PUBLIC SCHOOL -->
  <text font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="16.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="3.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      SIR C. R. REDDY PUBLIC SCHOOL
    </textPath>
  </text>

  <!-- Bottom Text: ELURU • CBSE 130072 • ESTD 1984 -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="4">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ★ ELURU • CBSE NO. 130072 • ESTD 1984 ★
    </textPath>
  </text>

  <!-- Inner Center Shield / Circle -->
  <circle cx="200" cy="200" r="132" fill="#0A1E38" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Rising Sun Rays -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="200" y1="120" x2="200" y2="92" />
    <line x1="180" y1="123" x2="168" y2="98" />
    <line x1="220" y1="123" x2="232" y2="98" />
    <line x1="162" y1="132" x2="140" y2="112" />
    <line x1="238" y1="132" x2="260" y2="112" />
    <line x1="150" y1="146" x2="122" y2="132" />
    <line x1="250" y1="146" x2="278" y2="132" />
  </g>

  <!-- Rising Sun Disk -->
  <circle cx="200" cy="148" r="28" fill="url(#sunGlow)" />
  <circle cx="200" cy="148" r="28" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />

  <!-- Open Book of Knowledge -->
  <g transform="translate(200, 196)">
    <!-- Book Spine & Pages -->
    <path d="M 0,16 C -20,6 -55,6 -75,18 L -75,-16 C -55,-28 -20,-28 0,-18 C 20,-28 55,-28 75,-16 L 75,18 C 55,6 20,6 0,16 Z"
          fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 0,-18 L 0,16" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Page text lines hint -->
    <path d="M -60,-8 C -45,-16 -25,-16 -12,-10 M -60,2 C -45,-6 -25,-6 -12,0 M -60,12 C -45,4 -25,4 -12,10"
          stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 60,-8 C 45,-16 25,-16 12,-10 M 60,2 C 45,-6 25,-6 12,0 M 60,12 C 45,4 25,4 12,10"
          stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Sacred Lotus Petals at the Base -->
  <g transform="translate(200, 240)">
    <!-- Center Petal -->
    <path d="M 0,-28 C -12,-10 -14,10 0,18 C 14,10 12,-10 0,-28 Z"
          fill="url(#goldGrad)" stroke="#583A00" stroke-width="1" />
    <!-- Inner Left & Right Petals -->
    <path d="M -1,-14 C -18,-6 -28,8 -14,22 C -6,14 -2,2 -1,-14 Z"
          fill="#E5C158" stroke="#583A00" stroke-width="1" opacity="0.95" />
    <path d="M 1,-14 C 18,-6 28,8 14,22 C 6,14 2,2 1,-14 Z"
          fill="#E5C158" stroke="#583A00" stroke-width="1" opacity="0.95" />
    <!-- Outer Flaring Petals -->
    <path d="M -8,0 C -34,4 -42,20 -24,28 C -12,24 -6,12 -8,0 Z"
          fill="#C59B27" stroke="#583A00" stroke-width="1" />
    <path d="M 8,0 C 34,4 42,20 24,28 C 12,24 6,12 8,0 Z"
          fill="#C59B27" stroke="#583A00" stroke-width="1" />
  </g>

  <!-- Motto Banner -->
  <g transform="translate(200, 286)">
    <path d="M -115,0 L -100,-10 L 100,-10 L 115,0 L 100,10 L -100,10 Z"
          fill="#061224" stroke="url(#goldGrad)" stroke-width="2" />
    <text y="3.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">
      QUALITY SERVICE &amp; VALUE BASED EDUCATION
    </text>
  </g>

  <!-- Academic Star Emblems -->
  <circle cx="140" cy="95" r="3" fill="url(#goldGrad)" />
  <circle cx="260" cy="95" r="3" fill="url(#goldGrad)" />
</svg>

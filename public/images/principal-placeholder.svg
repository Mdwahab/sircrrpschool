<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071830" />
      <stop offset="50%" stop-color="#0E2A52" />
      <stop offset="100%" stop-color="#040F20" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="url(#goldRing)" stroke-width="2" rx="12" />

  <!-- Dignified Portrait Silhouette -->
  <g transform="translate(300, 320)">
    <!-- Aura / Backing -->
    <circle cx="0" cy="-40" r="140" fill="#0A2244" stroke="#1D4C82" stroke-width="2" />
    <!-- Head -->
    <circle cx="0" cy="-90" r="65" fill="#64748B" />
    <!-- Neck -->
    <rect x="-24" y="-35" width="48" height="40" fill="#64748B" />
    <!-- Shoulders & Coat -->
    <path d="M -130,130 C -120,40 -60,0 0,0 C 60,0 120,40 130,130 Z" fill="#475569" />
    <!-- Collar & Tie -->
    <polygon points="0,30 -25,0 0,-15 25,0" fill="#FFFFFF" />
    <polygon points="0,5 -10,80 0,95 10,80" fill="#D4AF37" />
  </g>

  <!-- Status / Verification Notice -->
  <g transform="translate(300, 600)">
    <rect x="-240" y="-45" width="480" height="90" rx="8" fill="#040D1B" fill-opacity="0.95" stroke="#D4AF37" stroke-width="1.5" />
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D4AF37" text-anchor="middle">
      AUTHORIZED PORTRAIT PLACEHOLDER
    </text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">
      Official Principal Photograph Pending Management Submission
    </text>
    <text x="0" y="26" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">
      Sir C. R. Reddy Public School, CBSE, Eluru
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="sealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172F" />
      <stop offset="50%" stop-color="#0A2244" />
      <stop offset="100%" stop-color="#040D1B" />
    </linearGradient>
    <linearGradient id="blueMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="35%" stop-color="#60A5FA" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#040D1B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#sealBg)" />

  <!-- Outer Double Filigree Border in Royal Blue -->
  <rect x="24" y="24" width="552" height="702" fill="none" stroke="url(#blueMetallic)" stroke-width="2" rx="16" />
  <rect x="36" y="36" width="528" height="678" fill="none" stroke="url(#blueMetallic)" stroke-width="1" stroke-dasharray="6 4" rx="12" opacity="0.6" />

  <!-- Radial Glow Behind Insignia -->
  <circle cx="300" cy="350" r="220" fill="url(#blueGlow)" />

  <!-- Ceremonial Leadership Insignia -->
  <g transform="translate(300, 320)">
    <!-- Outer Shield / Circle -->
    <circle cx="0" cy="0" r="140" fill="#06152B" stroke="url(#blueMetallic)" stroke-width="4" />
    <circle cx="0" cy="0" r="126" fill="none" stroke="url(#blueMetallic)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
    <circle cx="0" cy="0" r="114" fill="#081E3C" stroke="url(#blueMetallic)" stroke-width="2" />

    <!-- Rays of Enlightenment -->
    <g stroke="url(#blueMetallic)" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-80" x2="0" y2="-100" />
      <line x1="56" y1="-56" x2="70" y2="-70" />
      <line x1="-56" y1="-56" x2="-70" y2="-70" />
      <line x1="80" y1="0" x2="100" y2="0" />
      <line x1="-80" y1="0" x2="-100" y2="0" />
    </g>

    <!-- Flaming Torch of Knowledge (Symbol of Wisdom) -->
    <!-- Flame -->
    <path d="M 0,-62 C -12,-45 -4,-30 0,-18 C 4,-30 12,-45 0,-62 Z" fill="url(#blueMetallic)" />
    <!-- Torch Bowl -->
    <path d="M -18,-18 C -14,-4 14,-4 18,-18 Z" fill="url(#blueMetallic)" />
    <!-- Torch Handle -->
    <path d="M -6,-16 L -4,15 L 4,15 L 6,-16 Z" fill="url(#blueMetallic)" />

    <!-- Open Book of Learning -->
    <g transform="translate(0, 32)">
      <!-- Pages Left & Right -->
      <path d="M -44,0 C -22,-6 -6,-2 0,6 C 6,-2 22,-6 44,0 L 40,32 C 20,26 6,30 0,36 C -6,30 -20,26 -40,32 Z" fill="#0C264C" stroke="url(#blueMetallic)" stroke-width="2" />
      <!-- Book Spine -->
      <line x1="0" y1="6" x2="0" y2="36" stroke="url(#blueMetallic)" stroke-width="2.5" />
      <!-- Page details -->
      <line x1="-32" y1="12" x2="-10" y2="10" stroke="url(#blueMetallic)" stroke-width="1.2" opacity="0.8" />
      <line x1="-30" y1="20" x2="-10" y2="18" stroke="url(#blueMetallic)" stroke-width="1.2" opacity="0.8" />
      <line x1="10" y1="10" x2="32" y2="12" stroke="url(#blueMetallic)" stroke-width="1.2" opacity="0.8" />
      <line x1="10" y1="18" x2="30" y2="20" stroke="url(#blueMetallic)" stroke-width="1.2" opacity="0.8" />
    </g>

    <!-- Laurel Wreath Around Base -->
    <g stroke="url(#blueMetallic)" fill="url(#blueMetallic)" opacity="0.85">
      <!-- Left Leaves -->
      <path d="M -60,50 C -75,30 -80,5 -75,-20" fill="none" stroke-width="2" />
      <ellipse cx="-72" cy="30" rx="6" ry="3" transform="rotate(-30 -72 30)" />
      <ellipse cx="-78" cy="10" rx="6" ry="3" transform="rotate(-15 -78 10)" />
      <ellipse cx="-75" cy="-10" rx="6" ry="3" transform="rotate(5 -75 -10)" />

      <!-- Right Leaves -->
      <path d="M 60,50 C 75,30 80,5 75,-20" fill="none" stroke-width="2" />
      <ellipse cx="72" cy="30" rx="6" ry="3" transform="rotate(30 72 30)" />
      <ellipse cx="78" cy="10" rx="6" ry="3" transform="rotate(15 78 10)" />
      <ellipse cx="75" cy="-10" rx="6" ry="3" transform="rotate(-5 75 -10)" />
    </g>
  </g>

  <!-- Title Ribbon & School Identification -->
  <g transform="translate(300, 560)">
    <text x="0" y="0" font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="url(#blueMetallic)" text-anchor="middle" letter-spacing="3">
      OFFICE OF THE PRINCIPAL
    </text>
    <line x1="-120" y1="14" x2="120" y2="14" stroke="url(#blueMetallic)" stroke-width="1" opacity="0.5" />
    <text x="0" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="1.5">
      Sir C. R. Reddy Public School
    </text>
    <text x="0" y="58" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
      CBSE Affiliation No. 130072 • Eluru, A.P.
    </text>
  </g>
</svg>

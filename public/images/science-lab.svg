<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071930" />
      <stop offset="100%" stop-color="#113359" />
    </linearGradient>
    <linearGradient id="flaskGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#labBg)" />
  <circle cx="400" cy="240" r="160" fill="#0C2548" stroke="#1E497A" stroke-width="2" />
  
  <!-- Laboratory Microscope & Flask Graphics -->
  <g transform="translate(400, 240)">
    <!-- Microscope -->
    <path d="M -60,60 L -10,60 L -10,45 L -30,45 L -30,0 L -15,-20 L -30,-40 L -45,-30 L -30,-10 L -45,10 L -45,45 L -60,45 Z" fill="#94A3B8" />
    <circle cx="-15" cy="-20" r="12" fill="#D4AF37" />
    <!-- Flask -->
    <path d="M 25,-40 L 45,-40 L 45,-20 L 70,40 L 0,40 L 25,-20 Z" fill="#0E2D54" stroke="#38BDF8" stroke-width="3" />
    <path d="M 8,36 L 62,36 L 50,15 L 20,15 Z" fill="url(#flaskGlow)" opacity="0.85" />
    <!-- Atoms Orbit -->
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-30)" />
    <circle cx="70" cy="-35" r="5" fill="#38BDF8" />
    <circle cx="-70" cy="35" r="5" fill="#D4AF37" />
  </g>

  <!-- Disclosure Label -->
  <rect x="60" y="490" width="680" height="64" rx="8" fill="#051020" fill-opacity="0.95" stroke="#D4AF37" stroke-width="1.5" />
  <text x="400" y="518" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    COMPOSITE SCIENCE &amp; RESEARCH LABORATORIES
  </text>
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081830" />
      <stop offset="50%" stop-color="#122A4E" />
      <stop offset="100%" stop-color="#051020" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#85580D" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad)" />
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="url(#goldRing)" stroke-width="2" rx="12" />

  <!-- Academic Silhouette -->
  <g transform="translate(300, 310)">
    <circle cx="0" cy="-30" r="140" fill="#0C2548" stroke="#1F4C82" stroke-width="2" />
    <circle cx="0" cy="-80" r="65" fill="#94A3B8" />
    <!-- Spectacles hint -->
    <circle cx="-25" cy="-80" r="14" fill="none" stroke="#D4AF37" stroke-width="2.5" />
    <circle cx="25" cy="-80" r="14" fill="none" stroke="#D4AF37" stroke-width="2.5" />
    <line x1="-11" y1="-80" x2="11" y2="-80" stroke="#D4AF37" stroke-width="2.5" />
    
    <rect x="-24" y="-25" width="48" height="35" fill="#64748B" />
    <!-- Classical Academic Coat / Robe -->
    <path d="M -130,130 C -120,40 -60,0 0,0 C 60,0 120,40 130,130 Z" fill="#334155" />
    <polygon points="0,20 -30,-5 0,-20 30,-5" fill="#FFFFFF" />
    <path d="M 0,20 L 0,130" stroke="#D4AF37" stroke-width="3" />
  </g>

  <!-- Tribute Plaque -->
  <g transform="translate(300, 600)">
    <rect x="-240" y="-45" width="480" height="90" rx="8" fill="#040E1E" fill-opacity="0.95" stroke="#D4AF37" stroke-width="1.5" />
    <text x="0" y="-18" font-family="'Cinzel', serif, Georgia" font-size="16" font-weight="bold" fill="#D4AF37" text-anchor="middle">
      SIR CATTAMANCHI RAMALINGA REDDY
    </text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">
      (1880 – 1951) • Renowned Educationist &amp; Visionary
    </text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">
      Inspirer of Sir C. R. Reddy Educational Institutions, Eluru
    </text>
  </g>
</svg>
